<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Your Free Key - Scooby</title>
<meta name="description" content="Continue to the Scooby free-key system.">
<meta name="robots" content="noindex, follow">
<link rel="shortcut icon" href="/assets/images/logo.png">
<link rel="stylesheet" href="/assets/css/free-access.css">
<script src="/assets/js/free-access.js" defer></script>
<script>
  // Check advertising availability before forwarding, preserving the product.
  document.addEventListener('DOMContentLoaded', function () {
    var KNOWN = ['gta5', 'fivem', 'rdr2', 'redm', 'cs2', 'gmod', 'spoofer'];
    var dest = new URL('https://whatwhatboy.com/scoobyontop.html');
    var p = (new URLSearchParams(location.search).get('product') || '').trim().toLowerCase();
    if (KNOWN.indexOf(p) !== -1) dest.searchParams.set('product', p);
    const proceed = () => location.replace(dest.toString());
    window.scoobyFreeAccess.onReady(proceed);
    document.getElementById('continue-key').addEventListener('click', async function (event) {
      event.preventDefault();
      if (await window.scoobyFreeAccess.check()) proceed();
    });
    window.scoobyFreeAccess.check().then(allowed => { if (allowed) proceed(); });
  });
</script>
<style>
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #080808; color: #f4f4f7;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    text-align: center; padding: 24px; line-height: 1.7;
  }
  .brand { font-size: 1.3rem; font-weight: 800; margin-bottom: 10px; }
  p { color: #9a9aaa; font-size: .95rem; margin: 0 0 22px; }
  a, button {
    display: inline-block; padding: 11px 22px; border-radius: 50px;
    background: #4f8ef5; color: #fff;
    font-size: .93rem; font-weight: 600; text-decoration: none;
  }
  a:hover { background: #2563eb; }
</style>
</head>
<body>
  <!-- The Continue button retries the same access check as the automatic redirect. -->
  <main>
    <div class="brand">scooby</div>
    <p>Taking you to the free key page&hellip;</p>
    <button type="button" id="continue-key">Continue</button>
    <noscript><p>Please enable JavaScript to check free-key access.</p></noscript>
  </main>
</body>
</html>
