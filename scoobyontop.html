<script>
  // Forward straight to the key system, carrying the product the visitor came
  // from (product pages link here as ?product=cs2 etc.). A plain meta refresh
  // would drop that, so it is only the no-JavaScript fallback below.
  (function () {
    var KNOWN = ['gta5', 'fivem', 'rdr2', 'redm', 'cs2', 'gmod', 'spoofer'];
    var dest = new URL('https://whatwhatboy.com/scoobyontop.html');
    var p = (new URLSearchParams(location.search).get('product') || '').trim().toLowerCase();
    if (KNOWN.indexOf(p) !== -1) dest.searchParams.set('product', p);
    location.replace(dest.toString());
  })();
</script>
