<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting - Scooby</title>
<meta name="robots" content="noindex, follow">
<link rel="shortcut icon" href="/assets/images/logo.png">
<meta http-equiv="refresh" content="0; url=https://whatwhatboy.com/scoobyontop.html">
<style>
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #080808; color: #f4f4f7;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    text-align: center; padding: 24px; line-height: 1.7;
  }
  .brand { font-size: 1.3rem; font-weight: 800; margin-bottom: 10px; }
  p { color: #9a9aaa; font-size: .95rem; margin: 0 0 22px; }
  a {
    display: inline-block; padding: 11px 22px; border-radius: 50px;
    background: #4f8ef5; color: #fff;
    font-size: .93rem; font-weight: 600; text-decoration: none;
  }
  a:hover { background: #2563eb; }
</style>
</head>
<body>
  <!-- The meta refresh above does the work; this is the fallback if it is blocked. -->
  <main>
    <div class="brand">scooby</div>
    <p>Redirecting&hellip;</p>
    <a href="https://whatwhatboy.com/scoobyontop.html">Continue</a>
  </main>
<script>/* scooby-file-guard: only fires when opened as a file, never over http */
(function(){if(location.protocol!=='file:')return;function show(){var b=document.createElement('div');b.setAttribute('data-i18n-skip','');b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:2147483647;background:#eab308;color:#1a1200;font:600 14px/1.5 Inter,system-ui,sans-serif;padding:12px 44px 12px 16px;text-align:center;box-shadow:0 2px 16px rgba(0,0,0,.5)';b.innerHTML='Opened as a file, so links and images are broken. Double-click <b>serve.bat</b> in the project folder, then browse <b>http://localhost:8080</b>';var x=document.createElement('button');x.textContent='\u00d7';x.setAttribute('aria-label','Dismiss');x.style.cssText='position:absolute;top:6px;right:10px;width:28px;height:28px;border:0;background:transparent;color:#1a1200;font-size:20px;cursor:pointer';x.onclick=function(){b.remove();};b.appendChild(x);document.body.appendChild(b);}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',show);else show();})();</script>
</body>
</html>
