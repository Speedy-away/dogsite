<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 449" role="img" aria-labelledby="title desc"><title id="title">Avast · temporary pause</title><desc id="desc">Illustrated step reference. Taskbar → Avast icon: Right-click and open Manage Shields Then Choose a short duration: Confirm only for a brief diagnostic Then Enable the shields again: Check protection is active afterward</desc><rect width="780" height="449" rx="16" fill="#171c28"/><text x="34" y="40" fill="#a9b7d2" font-family="Segoe UI,Arial,sans-serif" font-size="16">SCOOBY WIKI · ILLUSTRATED STEPS</text><text x="34" y="80" fill="#f0f3fa" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">Avast · temporary pause</text><rect x="26" y="110" width="728" height="86" rx="9" fill="#222a3b" stroke="#354059" stroke-width="1"/><circle cx="61" cy="152" r="19" fill="#344970"/><text x="61" y="158" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">1</text><text x="99" y="144" fill="#f0f3fa" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="600">Taskbar → Avast icon</text><text x="99" y="173" fill="#bac6de" font-family="Segoe UI,Arial,sans-serif" font-size="18">Right-click and open Manage Shields</text><rect x="26" y="213" width="728" height="86" rx="9" fill="#222a3b" stroke="#354059" stroke-width="1"/><circle cx="61" cy="255" r="19" fill="#344970"/><text x="61" y="261" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">2</text><text x="99" y="247" fill="#f0f3fa" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="600">Choose a short duration</text><text x="99" y="276" fill="#bac6de" font-family="Segoe UI,Arial,sans-serif" font-size="18">Confirm only for a brief diagnostic</text><rect x="26" y="316" width="728" height="86" rx="9" fill="#222a3b" stroke="#99b2ff" stroke-width="3"/><circle cx="61" cy="358" r="19" fill="#344970"/><text x="61" y="364" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">3</text><text x="99" y="350" fill="#f0f3fa" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="600">Enable the shields again</text><text x="99" y="379" fill="#bac6de" font-family="Segoe UI,Arial,sans-serif" font-size="18">Check protection is active afterward</text></svg>