<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480"><rect width="1000" height="480" rx="18" fill="#191c25"/><g font-family="Segoe UI,Arial,sans-serif"><text x="42" y="48" fill="#a9baff" font-size="16" letter-spacing="2">SCOOBY WIKI · FOLDER EXAMPLE</text><text x="42" y="100" fill="#f3f5fc" font-size="32" font-weight="700">Copy the whole theme folder</text><text x="42" y="138" fill="#bcc4d6" font-size="20">Open Settings → Appearance → Themes → Open Themes Folder</text><rect x="35" y="167" width="930" height="225" rx="10" fill="#101219" stroke="#a9baff" stroke-width="3"/><text x="58" y="210" fill="#a9baff" font-size="25" font-family="Consolas,monospace">C:\scooby\GTA5\themes\</text><text x="58" y="253" fill="#d9deed" font-size="23" font-family="Consolas,monospace">  MyTheme\</text><text x="58" y="296" fill="#d9deed" font-size="23" font-family="Consolas,monospace">    MyTheme.json</text><text x="58" y="339" fill="#d9deed" font-size="23" font-family="Consolas,monospace">    background.png</text><text x="42" y="442" fill="#bcc4d6" font-size="20">Example filenames. Keep the JSON and its referenced images together.</text></g></svg>