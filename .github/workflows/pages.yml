name: Publish website and reseller media

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Build site and current reseller media
        run: npm run build
      - name: Verify packaged download
        run: node tools/verify-reseller-download.cjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: project/build/publish
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website and media pack
        id: deployment
        uses: actions/deploy-pages@v4
